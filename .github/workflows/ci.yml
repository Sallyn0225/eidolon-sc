# 每个 PR 和 main 上的每次推送：检查后端、前端和 shell 脚本，同时构建两个镜像。
# 推送到 main 或 v* 标签时，检查和构建全部通过才把镜像推到 GHCR（部署见 docs/deploy.md「升级」）。
# 用 GITHUB_TOKEN 推到 main 的提交不会触发推送事件，那边（如 fork-showcase.yml）推完再手动触发一次 main 上的 CI。
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 同一个 PR 推了新提交时取消旧的运行；main 上的每次推送都跑完，免得漏发镜像
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # 平时 2 分钟左右；测试挂住时不等到 GitHub 默认的 6 小时
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # 这个 action 不发布 v10 这样的大版本标签
        with:
          working-directory: backend
          enable-cache: true
      # --locked：uv.lock 和 pyproject.toml 对不上时失败
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pyright
      # 每个 CPU 一个进程并行跑（pytest-xdist）；单个测试 2 分钟还没结束时打印所有线程的栈，挂住时能看出卡在哪里
      - run: uv run pytest -n auto -o faulthandler_timeout=120

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # shadcn 纪律里能机器检查的几条：cn 的导入、任意值里的颜色、important 类、不再引用 Astryx（frontend/AGENTS.md）
      - run: sh scripts/check-discipline.sh
      # next build 由下面的镜像构建跑

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/*.sh scripts/*.sh frontend/scripts/*.sh
      # wayfinder 地图的票：已解决的有结论、Blocked by 的票号存在、地图链接到它（docs/agents/issue-tracker.md）
      - run: sh scripts/check-scratch.sh

  # 和检查同时跑，只构建、不推送，层写进 GitHub Actions 的缓存
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 推送到 main 或 v* 标签（或在 main 上手动触发）、上面全部通过时：按 image 的缓存再构建一次（通常层都命中，缓存被清掉时整个重建），推到 GHCR
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [backend, frontend, shellcheck, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main → :main，v1.2.3 → :1.2.3 和 :latest，每次推送另有 :sha-<7 位提交哈希> 方便回滚
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sallyn0225/eidolon-sc-${{ matrix.service }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
