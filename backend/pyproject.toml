[project]
name = "eidolon"
version = "0.1.0"
description = "Eidolon-SC backend: conversation engine and API"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pipecat-ai[fish,soniox,webrtc]>=1.12.0",
    "pyrage>=1.4.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
eidolon = "eidolon.__main__:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# 只开 pyflakes 和 pycodestyle 的错误类规则，固定写出来，升级 ruff 时默认规则变了也不会突然多出一批
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 测试从别的测试文件导入 fixture（`mano_call,  # noqa: F401  # the fixture`），
# 再在测试参数里用同名参数接住，pyflakes 会把每个参数都报成重定义
"tests/**" = ["F811"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
